apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: payproof-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containers:
        - image: gcr.io/payproof-26/payproof-api
          ports:
            - containerPort: 8080
          env:
            - name: ALLOWED_ORIGINS
              value: "http://localhost:5173,https://payproof.vercel.app"
            - name: LLM_BASE_URL
              value: "https://proxy.vibecode.tours"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: payproof-secrets
                  key: llm-api-key
          resources:
            limits:
              memory: "1Gi"
              cpu: "1"
