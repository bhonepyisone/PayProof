apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: payproof-api
  annotations:
    run.googleapis.com/ingress: all-rails
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/payproof-api
          ports:
            - containerPort: 8080
          env:
            - name: ALLOWED_ORIGINS
              value: "http://localhost:5173,https://payproof.vercel.app"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: payproof-secrets
                  key: llm-api-key
          resources:
            limits:
              memory: "512Mi"
              cpu: "1"
