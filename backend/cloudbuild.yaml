steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/payproof-api', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/payproof-api']
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'payproof-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/payproof-api'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--update-env-vars'
      - 'ALLOWED_ORIGINS=http://localhost:5173,https://pay-proof-xi.vercel.app'
      - '--update-secrets'
      - 'LLM_API_KEY=payproof-secrets:llm-api-key'
      - '--set-env-vars'
      - 'LLM_BASE_URL=https://proxy.vibecode.tours'
      - 'PORT=8080'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 1200s